[project]
name = "surface-intel"
version = "0.1.0"
description = "Authorized attack-surface intelligence orchestration skill"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6,<3",
    "openpyxl>=3.1,<4",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]
surface-intel = "surface_intel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
